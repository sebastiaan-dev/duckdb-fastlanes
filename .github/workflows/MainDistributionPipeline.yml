# FastLanes requires Clang. The generic distribution workflow selects GCC on
# Linux and MSVC on Windows, so build the same supported targets explicitly.
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux_amd64
            image: quay.io/pypa/manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            platform: linux_arm64
            image: quay.io/pypa/manylinux_2_28_aarch64
          - os: macos-15-intel
            platform: osx_amd64
          - os: macos-15
            platform: osx_arm64
          - os: windows-2022
            platform: windows_amd64
            cc: clang-cl
            cxx: clang-cl
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc || 'clang' }}
      CXX: ${{ matrix.cxx || 'clang++' }}
      GEN: ninja
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.platform == 'osx_arm64' && 2 || 4 }}
      DUCKDB_PLATFORM: ${{ matrix.platform }}
      EXT_FLAGS: >-
        -DFLS_BUILD_STANDALONE_TESTS=ON
        ${{ matrix.platform == 'windows_amd64' && '-DCMAKE_EXE_LINKER_FLAGS=/DEBUG -DCMAKE_SHARED_LINKER_FLAGS=/DEBUG' || '' }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Verify DuckDB release metadata
        run: |
          git -C duckdb fetch origin tag v1.5.6 --no-tags
          test "$(git -C duckdb rev-parse HEAD)" = "$(git -C duckdb rev-parse 'v1.5.6^{commit}')"
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Cache macOS compiler outputs
        if: runner.os == 'macOS'
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.platform }}-
      - name: Install macOS compiler cache
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install ccache
      - name: Install build tools
        if: runner.os != 'Linux'
        run: python -m pip install cmake==3.31.6 ninja
      - name: Build and test (manylinux, glibc 2.28)
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            -e CC -e CXX -e GEN -e CMAKE_BUILD_PARALLEL_LEVEL \
            -e DUCKDB_PLATFORM -e EXT_FLAGS -e GITHUB_ACTIONS \
            "${{ matrix.image }}" bash -euxo pipefail -c '
              yum install -y clang
              export PATH=/opt/python/cp312-cp312/bin:$PATH
              python -m pip install cmake==3.31.6 ninja
              git config --global --add safe.directory "*"
              clang --version
              make release
              make test
              build/release/_deps/fls_repo-build/test/standalone/fastlanes_integration_test
            '
      - name: Build (macOS / Windows)
        if: runner.os != 'Linux'
        run: |
          clang --version
          make release
      - name: Test (macOS / Windows)
        if: runner.os != 'Linux'
        run: |
          build/release/_deps/fls_repo-build/test/standalone/fastlanes_integration_test
          make test
      - name: Diagnose Windows test crashes
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "$env:GITHUB_WORKSPACE/build/release/test/unittest.exe"
          $lldb = "$env:ProgramFiles/LLVM/bin/lldb.exe"
          if ((Test-Path $exe) -and (Test-Path $lldb)) {
            & $lldb --batch -o run -o "thread backtrace all" -- $exe "test/sql/parallel_roundtrip.test"
          }
      - name: Save macOS compiler outputs
        if: always() && runner.os == 'macOS'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ matrix.platform }}-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: fastlanes-v1.5.6-extension-${{ matrix.platform }}
          path: build/release/extension/fastlanes/fastlanes.duckdb_extension
          if-no-files-found: error

  format:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5.6
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5.6
      extension_name: fastlanes
      format_checks: format

  tidy:
    name: Tidy Check
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
      GEN: ninja
      TIDY_BINARY: clang-tidy-18
      TIDY_THREADS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y clang-18 clang-tidy-18 ninja-build
      - name: Check all extension reader/writer translation units
        run: make tidy-check
